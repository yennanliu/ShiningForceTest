name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Same container as local runs: see Dockerfile and tools/docker.sh
      - name: Layer check + tests
        run: tools/docker.sh test

      - name: Export Linux + smoke test
        run: tools/docker.sh export

      - uses: actions/upload-artifact@v4
        with:
          name: banner-linux
          path: build/Banner.x86_64
